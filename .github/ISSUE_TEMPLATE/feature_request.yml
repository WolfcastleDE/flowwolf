name: Feature request
description: Suggest an improvement to the editor, the engine or the API
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
  - type: textarea
    id: n8n
    attributes:
      label: How does n8n handle this? (optional)
      description: If the feature exists in n8n, a link or screenshot helps us match its behaviour.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration catalogue is up to date
        run: |
          python3 tools/gen_integrations.py
          git diff --exit-code src/nodes/integrations.json
      - run: cargo test --locked
      - run: cargo build --release --locked

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flowwolf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name fw -p 5678:5678 flowwolf:ci
          for i in $(seq 30); do curl -sf localhost:5678/healthz && break; sleep 1; done
          curl -sf localhost:5678/rest/settings | grep -q '"setupComplete":false'
          curl -sf -o /dev/null localhost:5678/app/
